name: Daily Financial News Scraping

on:
  schedule:
    # Run every day at 2:00 AM UTC (8:00 PM CST the previous day)
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run scraping regardless of time'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m textblob.download_corpora
        
    - name: Create exports directory
      run: mkdir -p exports

    # The database is stored in a Hugging Face dataset rather than in git: it
    # grows past GitHub's hard 100 MB per-file limit, at which point pushes are
    # rejected. Pull it first so duplicate detection sees previously seen URLs.
    - name: Pull database from Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO || 'MeridianAlgo/FinDB' }}
      run: |
        python hf_storage.py pull

    - name: Run financial news scraper
      env:
        DATABASE_URL: sqlite:///financial_news.db
        LOG_LEVEL: INFO
      run: |
        python scraper.py

    - name: Export yesterday's news in all formats
      env:
        DATABASE_URL: sqlite:///financial_news.db
      run: |
        python -c "
        from data_export import export_daily_news
        import os
        
        formats = ['json', 'csv', 'xml', 'parquet']
        for fmt in formats:
            try:
                filename = export_daily_news(fmt, 'exports')
                print(f'Exported {fmt}: {filename}')
            except Exception as e:
                print(f'Error exporting {fmt}: {e}')
        "
        
    - name: Generate daily summary
      env:
        DATABASE_URL: sqlite:///financial_news.db
      run: |
        python -c "
        from datetime import datetime, timedelta
        from database import SessionLocal
        from models import FinancialNews
        import json
        
        db = SessionLocal()
        try:
            yesterday = datetime.now().date() - timedelta(days=1)
            start_date = datetime.combine(yesterday, datetime.min.time())
            end_date = datetime.combine(yesterday, datetime.max.time())
            
            articles = db.query(FinancialNews).filter(
                FinancialNews.published_date >= start_date,
                FinancialNews.published_date <= end_date
            ).all()
            
            summary = {
                'date': yesterday.isoformat(),
                'total_articles': len(articles),
                'sources': {},
                'top_stocks': {},
                'sample_titles': []
            }
            
            for article in articles:
                source = article.source
                if source not in summary['sources']:
                    summary['sources'][source] = 0
                summary['sources'][source] += 1
                
                if article.mentioned_stocks:
                    stocks = json.loads(article.mentioned_stocks)
                    for stock in stocks:
                        if stock not in summary['top_stocks']:
                            summary['top_stocks'][stock] = 0
                        summary['top_stocks'][stock] += 1
                
                if len(summary['sample_titles']) < 5:
                    summary['sample_titles'].append(article.title)
            
            summary['top_stocks'] = dict(sorted(summary['top_stocks'].items(), key=lambda x: x[1], reverse=True)[:10])
            
            with open('exports/daily_summary.json', 'w') as f:
                json.dump(summary, f, indent=2)
            
            print(f\"Daily summary: {summary['total_articles']} articles from {len(summary['sources'])} sources\")
        finally:
            db.close()
        "

    - name: Clean up old data
      env:
        DATABASE_URL: sqlite:///financial_news.db
        DATA_RETENTION_DAYS: 90
      run: |
        python -c "
        from database import cleanup_old_data
        try:
            cleanup_old_data()
            print('Old data cleanup completed')
        except Exception as e:
            print(f'Cleanup error: {e}')
        "
        
    # Persist the run. This must not be skipped or soft-failed: losing it
    # loses the day's articles entirely, since nothing else stores them.
    - name: Push database and exports to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO || 'MeridianAlgo/FinDB' }}
      run: |
        python hf_storage.py push

    # Only the small text exports are committed; the database itself lives in
    # the Hugging Face dataset (see hf_storage.py).
    - name: Commit exports
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add exports/ || true

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily financial news update and cleanup - $(date +'%Y-%m-%d')"
          git pull --rebase -X ours origin main || git pull --rebase origin main
          git push origin main
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: financial-news-data-${{ github.run_number }}
        path: |
          exports/
          financial_news.db
        retention-days: 30
        
    - name: Create release (optional)
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: daily-${{ github.run_number }}
        name: Daily Financial News - ${{ github.run_number }}
        body: |
          Daily financial news scraping results.
          
          **Summary:**
          - Workflow: ${{ github.workflow }}
          - Run number: ${{ github.run_number }}
          
          **Files included:**
          - Database with all articles
          - Export files in JSON, CSV, XML, and Parquet formats
          - Daily summary statistics
        draft: false
        prerelease: true
        files: |
          exports/*
          financial_news.db
